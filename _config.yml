title: Loom
description: Legal documents and support for the Loom iOS app.
theme: minima
baseurl: /loom-legal

# Set baseurl to "" if this site later moves to a custom domain at the root.
# Page cross-links use {{ site.baseurl }} so the paths stay identical after the swap.

plugins:
  - jekyll-feed

exclude:
  - README.md

header_pages:
  - privacy.md
  - terms.md
  - guidelines.md
  - support.md
